[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-copilot-backend"
version = "1.0.0"
description = "Ops Copilot示範後端"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.4",
  "pydantic-settings>=2.7",
  "email-validator>=2.2",
  "pwdlib[argon2]>=0.2",
  "pyjwt>=2.10",
  "python-multipart>=0.0.20",
  "pypdf>=5.1",
  "openai>=1.59",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
